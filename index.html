<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Planet Susu</title>
  <style>
    @font-face{
      font-family:"OanaSoulHand";
      src:url("./OanaSoulHand-Regular.woff") format("woff");
      font-weight:400 900;
      font-style:normal;
      font-display:swap;
      /* Match the handwritten Latin glyphs to the visual size of Chinese text. */
      size-adjust:155%;
      unicode-range:U+0000-024F,U+1E00-1EFF;
    }
    @font-face{
      font-family:"OanaSoulHandDisplay";
      src:url("./OanaSoulHand-Regular.woff") format("woff");
      font-weight:400 900;
      font-style:normal;
      font-display:swap;
      unicode-range:U+0000-024F,U+1E00-1EFF;
    }
    @font-face{
      font-family:"OanaSoulHandTitlesCN";
      src:url("./OanaSoulHand-CN-Titles-933.woff") format("woff");
      font-weight:400;
      font-style:normal;
      font-display:swap;
      size-adjust:120%;
      unicode-range:U+3000-303F,U+3400-9FFF,U+FF00-FFEF;
    }
    :root{
      --cream:#fffaf2;
      --paper:#fffdf8;
      --pink:#e684a5;
      --pink-deep:#c85f86;
      --blue:#a9c8eb;
      --lavender:#c9bde7;
      --ink:#51485f;
      --muted:#8d8497;
      --line:rgba(81,72,95,.18);
      --shadow:0 24px 70px rgba(80,63,111,.15);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:"OanaSoulHand","Klee One","Hiragino Maru Gothic ProN","PingFang SC",sans-serif;color:var(--ink);background:#dcd8e8}
    button{font:inherit;color:inherit}
    button:focus-visible{outline:3px solid rgba(218,120,153,.35);outline-offset:4px}
    .app{
      width:min(1440px,100vw);height:100vh;min-height:680px;margin:auto;position:relative;overflow:hidden;
      background:linear-gradient(145deg,#fbdef0 0%,#dce7fb 48%,#e7def7 100%);
      isolation:isolate;
    }
    .app::before{content:"";position:absolute;inset:0;z-index:-2;background-image:radial-gradient(circle at 20% 18%,rgba(255,255,255,.95) 0 2px,transparent 3px),radial-gradient(circle at 72% 28%,rgba(255,255,255,.85) 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 74%,rgba(255,255,255,.8) 0 2px,transparent 3px),radial-gradient(circle at 34% 82%,rgba(255,255,255,.8) 0 1.5px,transparent 2.5px);background-size:230px 220px,310px 290px,270px 300px,350px 270px;animation:twinkle 5s ease-in-out infinite alternate}
    .app::after{content:"";position:absolute;inset:6%;z-index:-1;border:1px dashed rgba(255,255,255,.42);border-radius:48% 52% 44% 56%;transform:rotate(-4deg);pointer-events:none}
    @keyframes twinkle{to{opacity:.58}}

    .topbar{height:74px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;position:absolute;inset:0 0 auto;z-index:30}
    .brand{border:0;background:transparent;font-weight:800;letter-spacing:.12em;cursor:pointer}
    .tools{position:fixed;top:max(17px,env(safe-area-inset-top));right:max(20px,env(safe-area-inset-right));z-index:100;display:flex;gap:10px}
    .icon-btn{width:40px;height:40px;border:1px solid rgba(255,255,255,.62);border-radius:50%;background:rgba(255,255,255,.36);cursor:pointer}
    .music-control{position:relative}
    .music-panel{position:absolute;right:0;top:48px;width:260px;padding:16px 18px;background:rgba(255,253,248,.92);color:var(--ink);box-shadow:0 18px 42px rgba(78,67,112,.12);opacity:0;visibility:hidden;transform:translateY(-6px);transition:.22s ease;z-index:20}
    .music-panel.open{opacity:1;visibility:visible;transform:none}
    .music-panel h3{margin:0 0 11px;font-size:18px;font-weight:500;color:#925f76}.music-panel p{margin:0 0 10px;font-size:11px;color:var(--muted)}
    .track-choice{display:block;width:100%;padding:7px 0;border:0;border-bottom:1px dashed rgba(81,72,95,.14);background:transparent;text-align:left;color:#62586d;font-size:13px;cursor:pointer}.track-choice:last-child{border-bottom:0}.track-choice:hover,.track-choice.active{color:#c85f86}.track-choice small{display:block;margin-top:2px;color:var(--muted);font-size:10px}
    .music-status{display:inline-block;margin-left:4px;color:#c85f86;font-size:10px;letter-spacing:.06em}
    @media (max-width:430px){.tools{right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top))}.music-panel{right:0;width:min(245px,calc(100vw - 28px))}}

    .screen{display:none;position:absolute;inset:0;padding:92px 6vw 42px;overflow:auto}
    .screen.active{display:flex;animation:screen-in .45s ease both}
    @keyframes screen-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .center{align-items:center;justify-content:center;text-align:center;flex-direction:column}

    .eyebrow{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
    h1,h2,h3,p{margin-top:0}
    h1{font-size:clamp(44px,8vw,108px);line-height:.9;letter-spacing:-.05em;margin-bottom:24px;text-shadow:0 3px 0 rgba(255,255,255,.72)}
    h2{font-size:clamp(30px,4vw,56px);letter-spacing:-.035em;margin-bottom:10px}
    .subtitle{max-width:min(620px,calc(100vw - 48px));font-family:"OanaSoulHand","Klee One",sans-serif;letter-spacing:.04em;color:#675d74}
    .primary,.secondary,.planet-stop,.step-card,.star{cursor:pointer;transition:.2s ease}
    .primary{border:2px solid rgba(255,255,255,.8);background:var(--pink);color:white;padding:16px 34px;border-radius:999px;font-weight:800;box-shadow:0 10px 0 rgba(184,111,147,.16),0 16px 34px rgba(151,98,140,.18)}
    .primary:hover{transform:translateY(-3px) rotate(-1deg)}
    .secondary{border:1px solid var(--line);background:rgba(255,255,255,.55);padding:12px 20px;border-radius:999px}
    .ghost{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;cursor:pointer;color:var(--muted)}

    .planet{width:min(34vw,340px);aspect-ratio:1;border-radius:50%;margin:28px auto 38px;background:radial-gradient(circle at 34% 28%,#fff 0 4%,#ffd8e6 16%,#d7c6ef 48%,#98badf 74%,#7184b8 100%);box-shadow:inset -26px -24px 50px rgba(74,56,119,.22),0 0 0 18px rgba(255,255,255,.14),0 0 70px rgba(255,235,175,.8);position:relative;animation:float 4s ease-in-out infinite}
    .planet::before,.planet::after{content:"";position:absolute;border:1px solid rgba(255,255,255,.65);border-radius:50%;inset:46% -34%;transform:rotate(-13deg)}
    .planet::after{inset:48% -48%;transform:rotate(19deg);border-style:dashed}
    @keyframes float{50%{transform:translateY(-10px)}}

    .cover-screen{padding:86px clamp(32px,7vw,108px) 34px;align-items:center;overflow:hidden}
    .cover-layout{width:min(1160px,100%);height:100%;margin:auto;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;gap:36px}
    body:has([data-screen="cover"].active) .topbar{display:none}
    .cover-copy{text-align:center;align-self:start}.cover-copy h1{font-size:clamp(58px,6.4vw,92px);line-height:.9;letter-spacing:-.055em;margin:0;color:#925f76;text-shadow:none;white-space:nowrap}
    .cover-copy h1 span{display:inline;color:inherit}.cover-copy h1 span+span::before{content:" "}
    .cover-subtitle{margin:18px 0 0;color:#d27798;font-size:30px;line-height:1.25;letter-spacing:.035em}.cover-subtitle span{display:block;white-space:nowrap}
    .cover-screen .primary{padding:8px 3px;border:0;border-radius:0;background:transparent;color:#d27798;font-size:38px;letter-spacing:.11em;box-shadow:none;display:flex;align-items:center;gap:14px}
    .start-star{display:block;width:22px;height:22px;object-fit:contain;opacity:.82;filter:brightness(0) saturate(100%) invert(62%) sepia(25%) saturate(1120%) hue-rotate(292deg) brightness(94%) contrast(88%);transition:transform .25s ease,opacity .25s ease}
    .start-star:last-child{width:18px;transform:rotate(16deg);opacity:.64}
    .cover-screen .primary:hover{transform:translateY(-2px);color:#b85f82}.cover-screen .primary:hover .start-star:first-child{transform:rotate(-9deg) scale(1.08)}.cover-screen .primary:hover .start-star:last-child{transform:rotate(24deg) scale(1.08);opacity:.82}
    .cover-art{width:min(65vw,720px);height:100%;min-height:0;display:grid;place-items:center;overflow:visible;position:relative}
    .cover-planet{width:min(100%,760px);max-height:100%;height:auto;display:block;object-fit:contain;mix-blend-mode:multiply;transform-origin:center;animation:planet-breathe 5.2s ease-in-out infinite;will-change:transform,opacity}
    .cover-note{position:absolute;z-index:2;width:clamp(30px,3.1vw,48px);height:auto;pointer-events:none;opacity:.48;filter:brightness(0) saturate(100%) invert(62%) sepia(25%) saturate(1120%) hue-rotate(292deg) brightness(94%) contrast(88%);animation:note-drift 4.8s ease-in-out infinite}
    .cover-note.note-a{left:5%;top:17%;transform:rotate(-13deg)}
    .cover-note.note-b{right:3%;top:39%;width:clamp(24px,2.5vw,38px);transform:rotate(12deg);animation-delay:-1.7s;opacity:.4}
    .cover-note.note-c{left:9%;bottom:14%;width:clamp(25px,2.7vw,40px);transform:rotate(8deg);animation-delay:-3.1s;opacity:.35}
    .welcome-planet{width:min(62vw,620px);height:min(52vh,470px);margin:18px auto 24px}
    .enter-planet{padding:8px 3px;border:0;border-radius:0;background:transparent;color:#d27798;font-size:30px;font-weight:400;letter-spacing:.08em;box-shadow:none}
    .enter-planet:hover{transform:translateY(-2px);color:#b85f82}
    @keyframes planet-breathe{0%,100%{transform:translateY(2px) scale(.985);opacity:.94}50%{transform:translateY(-4px) scale(1.025);opacity:1}}
    @keyframes note-drift{0%,100%{translate:0 2px}50%{translate:0 -4px}}

    .letter-screen{padding-block:86px 46px}
    .paper{width:min(760px,88vw);min-height:610px;padding:clamp(34px,5vw,62px) clamp(28px,6vw,74px);position:relative;text-align:left;border:0;border-radius:8px 18px 10px 16px;background-color:rgba(255,253,248,.7);background-image:linear-gradient(rgba(169,200,235,.17) 1px,transparent 1px),linear-gradient(90deg,rgba(169,200,235,.12) 1px,transparent 1px);background-size:24px 24px;box-shadow:none}
    .paper::before{content:none}
    .paper .eyebrow{margin-bottom:10px}
    .paper h2{font-size:clamp(30px,4vw,46px);margin-bottom:20px;color:#925f76}
    .paper-copy{max-width:590px;min-height:374px;font-size:17px;line-height:1.9;color:#62586d;white-space:pre-line}
    .paper-copy.writing::after{content:"";display:inline-block;width:2px;height:1em;margin-left:3px;vertical-align:-.12em;background:#d27798;animation:letter-caret .75s steps(1) infinite}
    .letter-name{position:relative;color:#d27798;font-weight:700}
    .letter-name::before,.letter-name::after{position:absolute;color:#d27798;pointer-events:none;animation:letter-spark .8s ease both}
    .letter-name::before{content:"✦";left:18%;top:-1.4em;font-size:15px}
    .letter-name::after{content:"♡";right:-1.15em;top:-.7em;font-size:18px;animation-delay:.12s}
    .letter-doodle{position:absolute;width:38px;height:38px;object-fit:contain;opacity:.34;filter:brightness(0) saturate(100%) invert(62%) sepia(25%) saturate(1120%) hue-rotate(292deg) brightness(94%) contrast(88%);pointer-events:none}
    .letter-doodle.star{left:-17px;top:18%;transform:rotate(-12deg)}
    .letter-doodle.heart{right:-15px;bottom:19%;width:34px;transform:rotate(11deg)}
    .letter-consent{display:flex;align-items:center;justify-content:center;gap:10px;margin:24px auto 0;padding:8px 3px;border:0;border-radius:0;background:transparent;color:#d27798;font-size:25px;font-weight:400;letter-spacing:.06em;box-shadow:none;opacity:0;visibility:hidden;transform:translateY(8px);pointer-events:none}
    .letter-consent.ready{visibility:visible;pointer-events:auto;animation:letter-button-in .7s cubic-bezier(.2,.8,.2,1) forwards}
    .letter-consent img{width:34px;height:24px;object-fit:contain;opacity:.72;filter:brightness(0) saturate(100%) invert(62%) sepia(25%) saturate(1120%) hue-rotate(292deg) brightness(94%) contrast(88%)}
    .letter-consent:hover{transform:translateY(-2px);color:#b85f82}
    @keyframes letter-caret{50%{opacity:0}}
    @keyframes letter-spark{from{opacity:0;transform:translateY(8px) scale(.65)}to{opacity:1;transform:none}}
    @keyframes letter-button-in{0%{opacity:0;transform:translateY(8px) scale(.94)}70%{opacity:1;transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:none}}

    .menu-screen{flex-direction:column;align-items:center;padding-bottom:24px}
    .menu-head{text-align:center;margin-bottom:2px;position:relative;z-index:2}
    .planet-route{width:min(1120px,100%);min-height:510px;position:relative;margin:auto}
    .route-line{position:absolute;inset:2% 4% 0;width:92%;height:96%;overflow:visible;pointer-events:none}
    .route-line.mobile-route{display:none}
    .route-line path{fill:none;stroke:rgba(146,95,118,.28);stroke-width:1.25;stroke-linecap:round;stroke-dasharray:5 7;vector-effect:non-scaling-stroke}
    .route-line circle{fill:#fffaf2;stroke:rgba(146,95,118,.32);stroke-width:1;vector-effect:non-scaling-stroke}
    .planet-stop{position:absolute;width:clamp(190px,20vw,260px);padding:0;border:0;background:transparent;text-align:center;color:#51485f}
    .planet-stop::before{content:"";position:absolute;left:50%;top:48%;width:10px;height:10px;border-radius:50%;background:#fffaf2;box-shadow:0 0 0 1px rgba(146,95,118,.24);transform:translate(-50%,-50%);opacity:0;transition:opacity .2s ease}
    .planet-stop:nth-of-type(1){left:2%;top:30%}
    .planet-stop:nth-of-type(2){left:50%;top:5%;transform:translateX(-50%)}
    .planet-stop:nth-of-type(3){right:1%;top:34%}
    .planet-stop:nth-of-type(2):hover{transform:translateX(-50%) translateY(-7px)}
    .planet-stop:nth-of-type(1):hover,.planet-stop:nth-of-type(3):hover{transform:translateY(-7px)}
    .planet-stop img{display:block;width:100%;height:190px;object-fit:contain;transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .35s ease;animation:route-float 5s ease-in-out infinite}
    .planet-stop:nth-of-type(2) img{height:205px;animation-delay:-1.8s}
    .planet-stop:nth-of-type(3) img{animation-delay:-3.1s}
    .planet-stop:hover img,.planet-stop:focus-visible img{transform:scale(1.07) rotate(-2deg);filter:brightness(1.04) drop-shadow(0 0 18px rgba(255,244,196,.54))}
    .planet-stop strong{display:block;margin-top:-8px;font-size:clamp(23px,2.1vw,30px);font-weight:500;color:#925f76}
    .planet-stop small{display:block;margin-top:3px;font-size:12px;letter-spacing:.12em;color:#796f83}
    @keyframes route-float{0%,100%{translate:0 3px}50%{translate:0 -5px}}

    .module{width:100%;display:flex;flex-direction:column}
    .module-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}
    .module-title p{margin:0;color:var(--muted)}
    .return{border:0;background:rgba(255,255,255,.45);border-radius:999px;padding:11px 18px;cursor:pointer}
    .workspace{flex:1;min-height:470px;border:0;border-radius:28px;background:rgba(255,255,255,.42);box-shadow:var(--shadow);overflow:hidden}

    .fourcut-layout{height:100%;display:grid;grid-template-columns:minmax(0,1fr);background:rgba(255,250,242,.18)}
    .polaroid-stage{display:none}
    .camera-scene{width:min(520px,92%);height:100%;min-height:600px;position:relative;display:flex;justify-content:center;align-items:flex-start;padding-top:24px}
    .instant-camera{display:block;width:min(410px,82%);height:auto;object-fit:contain;position:relative;z-index:3;opacity:0;visibility:hidden;filter:drop-shadow(0 16px 18px rgba(63,52,60,.16))}
    .camera-scene.focus-mode .instant-camera{opacity:1;visibility:visible}
    .polaroid-output{position:absolute;z-index:2;top:356px;width:min(330px,68%);aspect-ratio:1.274;background:transparent;translate:0 -190px;opacity:0;transform:rotate(0deg);pointer-events:none}
    .polaroid-image{position:absolute;z-index:1;left:4.4%;top:8.2%;width:91.8%;height:73.1%;overflow:hidden;background:#fff}
    .polaroid-image img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;background:#fff;filter:contrast(1.02) brightness(1.4) saturate(.3);opacity:.18;transition:filter 1.8s ease,opacity 1.8s ease}
    .polaroid-frame{position:absolute;z-index:2;left:-13.7%;top:-28.6%;width:123%;height:157%;object-fit:fill;mix-blend-mode:multiply;pointer-events:none}
    .polaroid-caption{position:absolute;z-index:3;left:5%;right:5%;bottom:5.5%;text-align:center;font-size:clamp(13px,1.3vw,18px);color:#9b657c;opacity:0;transition:opacity .6s ease}
    .camera-scene.is-shooting .instant-camera{animation:camera-click .34s ease;filter:brightness(1.08) drop-shadow(0 16px 18px rgba(63,52,60,.16))}
    .camera-scene.is-ejecting .polaroid-output{opacity:1;animation:photo-eject 1.65s cubic-bezier(.18,.72,.22,1) forwards}
    .camera-scene.has-photo .polaroid-output{opacity:1;translate:0 86px;transform:rotate(-2.2deg)}
    .camera-scene.has-photo .polaroid-image img{filter:contrast(1.25) brightness(1.22) saturate(1.04);opacity:1}.camera-scene.has-photo .polaroid-caption{opacity:1}
    .confetti-canvas{position:fixed;inset:0;z-index:9;width:100%;height:100%;pointer-events:none}
    body:has(.camera-scene.focus-mode) .screen.active{animation:none;transform:none}
    .camera-scene.focus-mode{position:fixed;inset:0;z-index:50;width:min(1440px,100vw);height:100dvh;min-height:620px;margin:auto;padding-top:clamp(72px,11vh,112px);background:rgba(255,255,255,.88);backdrop-filter:blur(5px);animation:focus-fade .5s ease both}
    .camera-scene.focus-mode .instant-camera{width:min(410px,80vw);flex:none;animation:camera-arrive .58s cubic-bezier(.2,.8,.2,1) both}
    .camera-scene.focus-mode .polaroid-output{left:50%;top:calc(clamp(72px,11vh,112px) + 318px);width:min(250px,58vw);background:#fff;translate:-50% -190px}
    .camera-scene.focus-mode.is-ejecting .polaroid-output{animation:focus-photo-eject 1.65s cubic-bezier(.18,.72,.22,1) forwards}
    .camera-scene.focus-mode.has-photo{background:rgba(255,255,255,0);backdrop-filter:blur(0);transition:background .75s ease,backdrop-filter .75s ease}
    .camera-scene.focus-mode.has-photo .instant-camera{opacity:0;transform:translateY(-24px) scale(.94);animation:camera-fade-away .6s ease forwards}
    .camera-scene.focus-mode.has-photo .polaroid-output{position:fixed;z-index:52;top:50%;left:50%;width:var(--final-photo-width,min(440px,84vw));translate:-50% -50%;transform:rotate(-1.2deg);animation:photo-to-center .78s cubic-bezier(.2,.8,.2,1) forwards}
    .capture-doodle{display:none;position:fixed;z-index:51;width:46px;height:46px;object-fit:contain;opacity:0;pointer-events:none;filter:brightness(0) saturate(100%) invert(62%) sepia(25%) saturate(1120%) hue-rotate(292deg) brightness(94%) contrast(88%)}
    .focus-mode .capture-doodle{display:block}.focus-mode.has-photo .capture-doodle{opacity:.52;animation:doodle-appear .7s ease forwards}
    .capture-doodle.doodle-heart{left:calc(50% - 285px);top:57%;transform:rotate(-12deg)}.capture-doodle.doodle-star{right:calc(50% - 274px);top:36%;width:39px;transform:rotate(13deg)}
    .capture-doodle.doodle-music{left:calc(50% - 250px);top:31%;width:38px;transform:rotate(-9deg)}.capture-doodle.doodle-flower{right:calc(50% - 305px);top:61%;width:42px;transform:rotate(11deg)}
    .capture-doodle.doodle-moon{left:calc(50% - 315px);top:43%;width:34px;transform:rotate(-8deg)}.capture-doodle.doodle-rays{right:calc(50% - 245px);top:51%;width:36px;transform:rotate(9deg)}
    .overlay-again{display:none;position:fixed;z-index:53;left:50%;bottom:22px;translate:-50% 0;border:0;background:transparent;color:#c85f86;font-size:18px;letter-spacing:.06em;cursor:pointer}.focus-mode.has-photo .overlay-again{display:block;animation:doodle-appear .6s .25s ease both}
    @keyframes camera-click{45%{transform:translateY(5px) scale(.99)}}
    @keyframes photo-eject{0%{translate:0 -190px;transform:rotate(0)}70%{translate:0 102px;transform:rotate(-1deg)}100%{translate:0 86px;transform:rotate(-2.2deg)}}
    @keyframes focus-fade{from{background:rgba(255,255,255,0);backdrop-filter:blur(0)}to{background:rgba(255,255,255,.88);backdrop-filter:blur(5px)}}
    @keyframes camera-arrive{from{transform:translateX(-24vw) scale(.86);opacity:.55}to{transform:none;opacity:1}}
    @keyframes focus-photo-eject{0%{translate:-50% -190px;transform:rotate(0)}72%{translate:-50% 76px;transform:rotate(-.6deg)}100%{translate:-50% 62px;transform:rotate(-1.8deg)}}
    @keyframes camera-fade-away{to{opacity:0;transform:translateY(-24px) scale(.94)}}
    @keyframes photo-to-center{from{top:calc(clamp(72px,11vh,112px) + 318px);left:50%;width:min(250px,58vw);translate:-50% 62px;transform:rotate(-1.8deg)}to{top:50%;left:50%;width:var(--final-photo-width,min(440px,84vw));translate:-50% -50%;transform:rotate(-1.2deg)}}
    @keyframes doodle-appear{from{opacity:0;scale:.7}to{opacity:.48;scale:1}}
    .dress-panel{width:min(920px,100%);margin:auto;padding:48px 64px 42px;display:flex;flex-direction:column;justify-content:center;min-width:0;background:transparent}
    .panel-kicker{font-size:11px;letter-spacing:.18em;color:var(--pink-deep);text-transform:uppercase}.dress-panel h3{font-size:34px;margin:7px 0 4px}.dress-panel>p{font-size:13px;color:var(--muted);margin-bottom:22px}
    .outfit-browser{position:relative;min-width:0}

      const pointAt=progress=>{
        const angle=start+progress*turns*Math.PI*2;

        canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
        anchors=[];if(!cover.classList.contains('active'))return;
        const box=picture.getBoundingClientRect(),iw=box.width,ih=box.height;
        const ox=box.left-bounds.left,oy=box.top-bounds.top;
        anchors=[[.153,.248,'star'],[.318,.522,'star'],[.675,.468,'star'],[.8,.26,'star'],[.824,.785,'star'],[.46,.322,'heart'],[.64,.70,'heart']].map(([x,y,kind])=>({x:ox+x*iw,y:oy+y*ih,kind}));
      }
      function emit(x,y,count=1,kind){
        if(reduced.matches)return;
        const now=performance.now();
        const dark=document.querySelector('[data-screen="memories"].active,[data-screen="epilogue"].active')||cover.classList.contains('active');
        const palette=dark?colors:['#d29ab6','#b7a4d6','#9fbcd9','#d5b782'];
        for(let i=0;i<count;i++){
          const angle=Math.random()*Math.PI*2,speed=count>1?12+Math.random()*30:8+Math.random()*12;
          particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed-14,born:now,life:800+Math.random()*650,size:3+Math.random()*7,rotation:Math.random()*Math.PI,color:palette[Math.floor(Math.random()*palette.length)],kind:kind||(Math.random()<.2?'heart':Math.random()<.55?'star':'dot')});
        }
        if(particles.length>90)particles.splice(0,particles.length-90);
        if(!frame)frame=requestAnimationFrame(draw);
      }
      function draw(now){
        frame=0;ctx.clearRect(0,0,width,height);
        particles=particles.filter(p=>now-p.born<p.life);
        for(const p of particles){
          const t=(now-p.born)/p.life,seconds=(now-p.born)/1000;
          ctx.save();ctx.translate(p.x+p.vx*seconds,p.y+p.vy*seconds);ctx.rotate(p.rotation+seconds*.35);
          ctx.globalAlpha=Math.sin(Math.PI*t)*.85;ctx.fillStyle=p.color;ctx.strokeStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=9;ctx.lineWidth=1.4;
          const s=p.size*(1-t*.35);ctx.beginPath();
          if(p.kind==='heart'){
            ctx.moveTo(0,s*.7);ctx.bezierCurveTo(-s*1.6,-s*.3,-s*.7,-s*1.4,0,-s*.5);ctx.bezierCurveTo(s*.7,-s*1.4,s*1.6,-s*.3,0,s*.7);ctx.stroke();
          }else if(p.kind==='star'){
            for(let j=0;j<8;j++){const a=j*Math.PI/4,r=j%2?s*.26:s;j?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();
          }else{ctx.arc(0,0,s*.28,0,Math.PI*2);ctx.fill()}
          ctx.restore();
        }
        if(particles.length)frame=requestAnimationFrame(draw);
      }
      function clear(){cancelAnimationFrame(frame);frame=0;particles=[];previous=null;hot=-1;ctx.clearRect(0,0,width,height);dots.forEach(dot=>dot.classList.remove('is-near'))}
      document.addEventListener('pointermove',event=>{
        if(reduced.matches||!bounds||memoryModal.open)return;
        const x=event.clientX-bounds.left,y=event.clientY-bounds.top,now=performance.now();
        if(cover.classList.contains('active'))dots.forEach(dot=>{const b=dot.getBoundingClientRect();dot.classList.toggle('is-near',Math.hypot(event.clientX-b.left-b.width/2,event.clientY-b.top-b.height/2)<65)});
        const near=anchors.findIndex(a=>Math.hypot(x-a.x,y-a.y)<42);
        if(near>=0&&near!==hot){const a=anchors[near];emit(a.x,a.y,9,a.kind)}hot=near;
        if(now-last<45||previous&&Math.hypot(x-previous.x,y-previous.y)<7)return;
        emit(x,y,2);previous={x,y};last=now;
      },{passive:true});
      document.addEventListener('pointerdown',event=>{if(!bounds||memoryModal.open||event.target.closest('button,a,select,input,video'))return;emit(event.clientX-bounds.left,event.clientY-bounds.top,12)},{passive:true});
      document.documentElement.addEventListener('pointerleave',()=>{previous=null;hot=-1;dots.forEach(dot=>dot.classList.remove('is-near'))});
      new ResizeObserver(resize).observe(canvas);window.addEventListener('resize',resize);art.addEventListener('load',resize);
      const screenObserver=new MutationObserver(()=>{clear();resize()});
      screens.forEach(screen=>screenObserver.observe(screen,{attributes:true,attributeFilter:['class']}));
      document.addEventListener('visibilitychange',()=>{if(document.hidden)clear()});
      reduced.addEventListener('change',clear);resize();
    })();
  </script>
</body>
